name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Build and gate the distribution (pure Python: one universal wheel + sdist)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Run the test suite
        run: |
          uv sync
          uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the built wheel
        run: >
          uv run --no-project --isolated --with ./dist/plasmakit-*.whl
          python -c "import plasmakit as fb; assert fb.validate(verbose=False).passed"

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Publish to PyPI via trusted publishing (OIDC; no tokens)
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment:
      name: pypi
      url: https://pypi.org/p/plasmakit
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: List dist contents
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
