[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusionbench"
version = "0.1.0"
description = "Fusion nuclear physics engine: plasma states, fusion reactivities, and neutron sources validated against published references."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "alphabench", email = "contact@alphabench.in" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11"]
keywords = ["fusion", "plasma", "neutronics", "nuclear", "reactivity", "neutron-source"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

# openmc is intentionally not an extra: it is not distributed on PyPI.
# Install it via conda-forge to use SpatialNeutronSource.to_openmc().
[project.optional-dependencies]
xarray = ["xarray>=2023.1"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "xarray>=2023.1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF", "D"]
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/fusionbench/bosch_hale.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openmc.*", "xarray.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["transport: requires openmc plus nuclear data (OPENMC_CROSS_SECTIONS)"]
filterwarnings = ["error::fusionbench.errors.ValidityRangeWarning"]
